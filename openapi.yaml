          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ลบการสมัครสมาชิกสำเร็จ
        '404':
          description: ไม่พบข้อมูล
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ไม่พบข้อมูลการสมัครสมาชิก
        '500':
          $ref: '#/components/responses/ServerError'
components:
  responses:
    BadRequest:
      description: ข้อมูลไม่ครบถ้วนหรือไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: ข้อมูลไม่ครบถ้วน
    Conflict:
      description: 'ข้อมูลซ้ำ (ชื่อสาขา, email หรือ phone)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: มีข้อมูลซ้ำอยู่แล้ว
    UnsupportedMediaType:
      description: 'Content-Type ต้องเป็น application/json'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 'กรุณาส่งข้อมูลในรูปแบบ application/json'
    ServerError:
      description: ข้อผิดพลาดภายในระบบ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดที่ไม่คาดคิดภายในระบบ
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    ErrorObject:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    GymInput:
      type: object
      required:
        - name
        - address
        - monthly_fee
      properties:
        name:
          type: string
        address:
          type: string
        monthly_fee:
          type: number
          minimum: 0
    Gym:
      allOf:
        -
          type: object
          properties:
            id:
              type: integer
              example: 1
        -
          $ref: '#/components/schemas/GymInput'
    TrainerInput:
      type: object
      required:
        - name
        - gym_id
      properties:
        name:
          type: string
        specialty:
          type: string
          nullable: true
        gym_id:
          type: integer
          example: 1
    Trainer:
      allOf:
        -
          type: object
          properties:
            id:
              type: integer
              example: 1
        -

openapi: 3.0.3
info:
  title: 'Gym API'
  version: 1.0.0
  description: 'ระบบข้อมูลฟิตเนส (Fitness Management System) - gyms, trainers, members, memberships'
servers:
  -
    url: /api/v1
    description: 'Current server'
tags:
  -
    name: gyms
  -
    name: trainers
  -
    name: members
  -
    name: memberships
paths:
  /gyms:
    get:
      tags:
        - gyms
      summary: ดึงฟิตเนสทั้งหมด
      description: คืนรายการฟิตเนสทั้งหมด
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gym'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - gyms
      summary: เพิ่มฟิตเนสใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInput'
            example:
              name: 'Fit Plus Ladprao'
              address: '123 ถ.ลาดพร้าว กรุงเทพฯ'
              monthly_fee: 1200
      responses:
        '201':
          description: เพิ่มฟิตเนสสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: '#/components/schemas/Gym'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
  '/gyms/{id}':
    get:
      tags:
        - gyms
      summary: 'ดึงฟิตเนสตาม id'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: '#/components/schemas/Gym'
        '404':
          description: ไม่พบข้อมูล
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ไม่พบข้อมูลฟิสเนต
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - gyms
      summary: 'แก้ไขฟิตเนสตาม id'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymInput'
            example:
              name: 'Fit Plus Ladprao'
              address: '123 ถ.ลาดพร้าว กรุงเทพฯ'
              monthly_fee: 1200
      responses:
        '200':
          description: แก้ไขฟิตเนสสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: '#/components/schemas/Gym'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 'ไม่พบข้อมูล หรือข้อมูลที่อ้างอิง'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ไม่พบข้อมูลฟิสเนต
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - gyms
      summary: 'ลบฟิตเนสตาม id'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: ลบฟิตเนสสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ลบฟิตเนสสำเร็จ
        '404':
          description: ไม่พบข้อมูล
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ไม่พบข้อมูลฟิสเนต
        '409':
          description: 'ลบไม่ได้เพราะมีข้อมูลอื่นอ้างอิงอยู่ (Foreign Key)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ไม่สามารถลบฟิตเนสนี้ได้
        '500':
          $ref: '#/components/responses/ServerError'
